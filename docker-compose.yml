services:
  web:
    build: .
    image: favoritos:latest
    container_name: favoritos
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      # Backend al que nginx reenvía /api/. Si no se define, usa el valor del Dockerfile.
      - API_URL
    extra_hosts:
      # Permite resolver host.docker.internal también en Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
