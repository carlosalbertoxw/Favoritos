# Levanta el frontend junto con la API y MongoDB del repositorio Api-restful-favoritos,
# que debe estar clonado junto a este (../Api-restful-favoritos). Requiere Compose 2.20 o superior.
#
#   docker compose -f docker-compose.yml -f docker-compose.api.yml up -d --build --wait
#
# Todo queda en una sola red: nginx reenvía /api/ al servicio "api" por su nombre,
# y el frontend arranca cuando la API ya responde a su healthcheck.

include:
  - ../Api-restful-favoritos/docker-compose.yml

services:
  web:
    environment:
      API_URL: http://api:5000
    depends_on:
      api:
        condition: service_healthy
        # Si se recrea la API, Compose reinicia nginx para que resuelva su nueva IP.
        restart: true
