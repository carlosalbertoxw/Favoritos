name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Falla si la cobertura baja de los umbrales definidos en angular.json
      - run: npm run test:ci
      - run: npm run build
      # Sirve el build y verifica /health.json, index.html y sus recursos
      - run: npm run healthcheck

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Construir y levantar el contenedor (espera al healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 60
        env:
          WEB_PORT: 8090
      - name: Healthcheck contra el contenedor
        # --with-headers verifica las cabeceras de seguridad de nginx
        run: node scripts/healthcheck.mjs http://localhost:8090 --with-headers
      - name: El contenedor corre sin privilegios de root
        run: test "$(docker compose exec -T web id -u)" != "0"
      - name: Logs del contenedor
        if: failure()
        run: docker compose ps && docker compose logs
      - name: Detener el contenedor
        if: always()
        run: docker compose down

  vulnerabilities:
    name: Vulnerabilidades de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm audit --audit-level=moderate
