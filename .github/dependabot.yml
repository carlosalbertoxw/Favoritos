version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Angular fija el rango de TypeScript que admite (p. ej. ">=6.0 <6.1").
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      # Estos paquetes exigen versiones exactas entre sí: deben actualizarse en un solo PR.
      angular:
        patterns:
          - "@angular/*"
          - angular-eslint
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      # El resto de herramientas de desarrollo, juntas: evita conflictos en package-lock.json.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
