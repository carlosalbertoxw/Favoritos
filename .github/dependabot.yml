version: 2

updates:
  # Dependencias npm de la aplicación Angular
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # @angular/build fija el rango de TypeScript que soporta (p. ej. ">=6.0 <6.1");
      # los saltos mayores de TypeScript llegan junto con la actualización de Angular.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
        update-types:
          - minor
          - patch
      # vitest y sus plugins exigen la misma versión exacta entre sí,
      # así que deben actualizarse en un solo PR (incluidas versiones mayores).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      herramientas-dev:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "angular-eslint"
        update-types:
          - minor
          - patch
      produccion:
        dependency-type: production
        exclude-patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch

  # Acciones usadas por el workflow de CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: "ci"
    groups:
      acciones:
        patterns:
          - "*"

  # Imágenes base de los Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: "docker"
