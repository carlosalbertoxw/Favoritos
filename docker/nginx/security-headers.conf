# Cabeceras de seguridad para todas las respuestas.
#
# style-src necesita 'unsafe-inline' porque Angular inserta los estilos de los componentes
# en etiquetas <style> en tiempo de ejecución. script-src no permite scripts inline, por eso
# angular.json desactiva inlineCritical (añade un <script> inline para cargar styles.css).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
